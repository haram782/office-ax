# Office-AX 클로즈드 베타 스택. 실제 실행은 scripts/beta_deploy.sh만 사용한다.
name: officeax-beta

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-officeax_beta}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BETA_DB_PASSWORD:?}
    volumes:
      - beta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: ${BETA_POSTGRES_MEMORY:-768m}
    cpus: ${BETA_POSTGRES_CPUS:-1.0}
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "${BETA_LOG_MAX_SIZE:-10m}"
        max-file: "${BETA_LOG_MAX_FILES:-5}"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - beta_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: ${BETA_REDIS_MEMORY:-256m}
    cpus: ${BETA_REDIS_CPUS:-0.5}
    logging: *bounded-logs

  backend-web:
    image: officeax-beta-backend:${BETA_RELEASE_TAG:?}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: sh -c "python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 180"
    env_file: .env.beta
    environment:
      TMPDIR: /shared-tmp
    volumes:
      - beta_shared_tmp:/shared-tmp
      - beta_media:/app/backend/media
      - beta_static:/app/backend/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://localhost:8000/readyz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: ${BETA_BACKEND_WEB_MEMORY:-1536m}
    cpus: ${BETA_BACKEND_WEB_CPUS:-1.5}
    logging: *bounded-logs

  backend-worker:
    image: officeax-beta-backend:${BETA_RELEASE_TAG:?}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q celery --loglevel=info --concurrency=2
    env_file: .env.beta
    environment:
      TMPDIR: /shared-tmp
    volumes:
      - beta_shared_tmp:/shared-tmp
      - beta_media:/app/backend/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: ${BETA_BACKEND_WORKER_MEMORY:-3g}
    cpus: ${BETA_BACKEND_WORKER_CPUS:-2.0}
    logging: *bounded-logs

  backend-beat:
    image: officeax-beta-backend:${BETA_RELEASE_TAG:?}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # stop 이후 같은 컨테이너를 다시 start/up 하면 writable layer에 남은
    # /tmp/celerybeat.pid 때문에 celery beat가 "Pidfile already exists"로
    # exit 73 재시작 루프에 빠진다. 시작 전에 stale pidfile을 제거한다.
    command: sh -c "rm -f /tmp/celerybeat.pid && exec celery -A config beat --loglevel=info --pidfile=/tmp/celerybeat.pid"
    env_file: .env.beta
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -r /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: ${BETA_BACKEND_BEAT_MEMORY:-384m}
    cpus: ${BETA_BACKEND_BEAT_CPUS:-0.5}
    logging: *bounded-logs

  ax-worker:
    image: officeax-beta-ax:${BETA_RELEASE_TAG:?}
    build:
      context: ./ax-engine
    restart: unless-stopped
    env_file: .env.beta
    environment:
      ARTIFACT_DIR: /app/backend/media
    volumes:
      - beta_shared_tmp:/shared-tmp
      - beta_media:/app/backend/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    mem_limit: ${BETA_AX_WORKER_MEMORY:-4g}
    cpus: ${BETA_AX_WORKER_CPUS:-2.0}
    logging: *bounded-logs

  nginx:
    image: officeax-beta-nginx:${BETA_RELEASE_TAG:?}
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?}
    restart: unless-stopped
    ports:
      - "${BETA_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/beta.conf:/etc/nginx/conf.d/default.conf:ro
      - beta_media:/srv/media:ro
      - beta_static:/srv/static:ro
    depends_on:
      backend-web:
        condition: service_healthy
    healthcheck:
      # Alpine wget이 localhost를 ::1(IPv6)로 먼저 풀어 nginx가 IPv4만 listen하면 연결이 거부된다.
      # 127.0.0.1을 명시해 IPv4로 고정한다.
      test: ["CMD-SHELL", "wget -q --header='X-Forwarded-Proto: https' -O /dev/null http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: ${BETA_NGINX_MEMORY:-256m}
    cpus: ${BETA_NGINX_CPUS:-0.5}
    logging: *bounded-logs

volumes:
  beta_postgres_data:
  beta_redis_data:
  beta_media:
  beta_static:
  beta_shared_tmp:
