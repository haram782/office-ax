# 운영 beta compose를 유지하고, 호스트 Claude CLI QA에 필요한 경계만 덮어쓴다.
# volumes는 !override로 강제 치환한다 — 기본 병합(concatenate)을 쓰면 base의
# beta_media/beta_shared_tmp named volume이 그대로 남아 MEDIA_ROOT/TMPDIR이
# 가리키는 bind mount와 별개로 붕 뜬 채 마운트되어 경로 계약이 흐려진다.
services:
  redis:
    ports:
      - "127.0.0.1:${LOCAL_BETA_REDIS_PORT:-6380}:6379"

  backend-web:
    environment:
      MEDIA_ROOT: ${LOCAL_BETA_MEDIA_DIR:?}
      TMPDIR: ${LOCAL_BETA_TMP_DIR:?}
    volumes: !override
      - type: bind
        source: ${LOCAL_BETA_MEDIA_DIR:?}
        target: ${LOCAL_BETA_MEDIA_DIR:?}
      - type: bind
        source: ${LOCAL_BETA_TMP_DIR:?}
        target: ${LOCAL_BETA_TMP_DIR:?}
      - beta_static:/app/backend/staticfiles

  backend-worker:
    environment:
      MEDIA_ROOT: ${LOCAL_BETA_MEDIA_DIR:?}
      TMPDIR: ${LOCAL_BETA_TMP_DIR:?}
    volumes: !override
      - type: bind
        source: ${LOCAL_BETA_MEDIA_DIR:?}
        target: ${LOCAL_BETA_MEDIA_DIR:?}
      - type: bind
        source: ${LOCAL_BETA_TMP_DIR:?}
        target: ${LOCAL_BETA_TMP_DIR:?}

  # 호스트 macOS에서 claude_cli를 쓰는 AX 워커가 대신 돈다.
  # container-ax 프로필을 명시적으로 켜지 않는 한 로컬 QA 기본 스택(up -d)에는
  # 포함되지 않는다.
  ax-worker:
    profiles: [container-ax]

  nginx:
    volumes: !override
      - ./infra/nginx/beta.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LOCAL_BETA_MEDIA_DIR:?}:/srv/media:ro
      - beta_static:/srv/static:ro
