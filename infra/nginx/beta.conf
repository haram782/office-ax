# Office-AX 베타 nginx 설정 — 단일 origin (프론트 + API + media)
# ngrok 터널이 이 서버의 80 포트(호스트 8080)를 바라본다.

server {
    listen 80;
    server_name _;

    # backend-web 컨테이너가 재생성되면 IP가 바뀐다.
    # proxy_pass에 변수를 쓰면 nginx가 요청 시점마다 Docker DNS(127.0.0.11)로
    # 재해석하므로, backend만 재배포해도 nginx 재시작이 필요 없다.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend-web:8000;

    # 업로드 파일 크기 상한 — Django FILE_UPLOAD_MAX_MEMORY_SIZE(10MB)보다 여유
    client_max_body_size 25m;

    # PPTX 동기 렌더링 등 느린 요청 대비
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 외부 터널이 주입한 proto를 전달한다. 직접 호스트 포트 공개는 금지한다.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = /healthz {
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $backend_upstream;
        access_log off;
    }

    # Django API
    location /api/ {
        proxy_pass $backend_upstream;
    }

    # Django admin (운영 체크리스트: 강한 비밀번호 필수 — 공개 인터넷 노출)
    location /admin/ {
        proxy_pass $backend_upstream;
    }

    # collectstatic 산출물 (admin CSS 등)
    location /static/ {
        alias /srv/static/;
        access_log off;
    }

    # 인증과 객체 소유권 검사는 Django media gateway가 수행한다.
    location /media/ {
        proxy_pass $backend_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Django의 X-Accel-Redirect로만 진입 가능한 실제 파일 경계다.
    location /_protected_media/ {
        internal;
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # React SPA — 클라이언트 라우팅 폴백
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
